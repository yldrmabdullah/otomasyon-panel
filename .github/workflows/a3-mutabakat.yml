name: A3 ↔ Logo Mutabakatı (haftalık + ay kapanışı)

# POL "A3 Aylık Satış Kontrol" raporunu indirip Logo (BFF /dis/v1) ile karşılaştırır,
# sonucu Postgres'e yazar (mutabakat_a3). Panel Mevzuat → "A3 ↔ Logo Mutabakatı" okur.
#
# ⚠️ Logo VPN arkasında; runner Logo'ya DOĞRUDAN erişemez → Logo verisi BFF üstünden
# (reportapi, public) çekilir. POL internete açık (izleme job'u zaten oraya bağlanıyor).
#
# ⚠️ Playwright gerekir (POL Excel indirmesi ViewState-ağır, saf-HTTP kırılgan) → runner'da
# chromium kurulur. Vercel serverless'ta Playwright çalışmadığı için bu iş Actions'ta koşar
# (ASIS izleme/mutabakat-cek ile aynı mimari; cron-job.org tetikler, kota public'te yenmez).

on:
  schedule:
    # ⚠️ 2026-08-27: ESKİDEN yalnız '0 6 2 * *' vardı (ayın 2'si, 'onceki' = KAPANMIŞ ay).
    # Cari ay ancak ay bittikten sonra panele düşüyordu; üstelik cron o güne dek hiç
    # tetiklenmemişti (Ocak–Ağustos'un tamamı 12 Ağu'da ELLE çekilmiş).
    #
    #  1) Her pazartesi 06:00 UTC — 'guncel' (POL'ün en yeni dönemi = cari ay).
    - cron: '0 6 * * 1'
    #  2) Her ayın 2'si 06:00 UTC — 'onceki': kapanan ayın nihai hali.
    - cron: '0 6 2 * *'
  # Elle VE dışarıdan (cron-job.org → GitHub API). Dönem seçilebilir.
  workflow_dispatch:
    inputs:
      donem:
        description: "POL dönem kodu (boş: cari ay · 'onceki': geçen ay · 18=2026 Tem · 19=Ağu)"
        required: false
        default: ''

concurrency:
  group: a3-mutabakat
  cancel-in-progress: false

jobs:
  mutabakat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      # Playwright chromium — POL Excel indirmesi için (yalnız chromium, hızlı).
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Şema (idempotent)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Dönem, hangi cron'un tetiklediğinden türetilir; elle girdi her şeyi ezer.
      #   ayın 2'si  → 'onceki' (kapanan ay)
      #   pazartesi / elle boş → 'guncel' (POL'ün en yeni dönemi = cari ay)
      # Araç dönemi DELETE+INSERT ediyor → aynı dönemi tekrar çekmek zararsız.
      - name: A3 çek + Logo kıyas
        run: |
          if [ -n "$DONEM" ]; then SEC="$DONEM"
          elif [ "$TETIK" = "0 6 2 * *" ]; then SEC="onceki"
          else SEC="guncel"; fi
          echo "::notice::A3 dönem seçimi=$SEC"
          npm run a3 -- "$SEC"
        env:
          DONEM: ${{ github.event.inputs.donem }}
          TETIK: ${{ github.event.schedule }}
          POL_URL: ${{ secrets.POL_URL }}
          POL_KULLANICI: ${{ secrets.POL_KULLANICI }}
          POL_SIFRE: ${{ secrets.POL_SIFRE }}
          # Logo BFF (canlı, public). Anahtar = BFF dış API X-Api-Key.
          BFF_URL: ${{ secrets.BFF_URL }}
          BFF_API_KEY: ${{ secrets.BFF_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
