name: A1b Stok-Satış Anomali (günlük)

# POL "Tablo A1b - Düzeltilmiş Otomasyon Sistemi" raporunu indirir, pompa satışı
# ile tank stok hareketi uyuşmayan kayıtları DETERMİNİSTİK kural motoruyla
# (core/a1bKural.ts) işaretler → panel Mevzuat → "Stok-Satış Anomali".
#
# Kaynak gereksinim: "Günlük Akaryakıt Tank Stok-Satış Anomali Kontrol Sistemi"
# teknik dokümanı (Turgut Dağıtım, 18.08.2026 v1.0).
#
# ⚠️ AI KULLANILMAZ — doküman 2. madde: aynı veri her gün aynı sonucu vermeli,
# eşikler denetlenebilir ve sonuç EPDK denetiminde açıklanabilir olmalı.
# ⚠️ Playwright (POL Excel indirmesi) → Actions'ta koşar. Salt-okuma.

on:
  schedule:
    # ⚠️ 2026-08-27: SAATLER GECEYE ÇEKİLDİ — kullanıcı sabah panele baktığında veri
    # HAZIR olsun diye (eskiden TR 11:00'de koşuyordu, yani mesai içinde).
    # 03:00 UTC (TR 06:00) — bir ÖNCEKİ günün kapanışı POL'de oturmuş olur.
    # Fiyat takibinden (02:15) sonra: aynı anda iki Playwright işi POL'e yüklenmesin.
    - cron: '0 3 * * *'
    # Akşam 20:00 UTC (TR 23:00) — İKİNCİ tur.
    # Sorun: sabah koşusu TR 11:41'de yapılıyor ve POL'de O GÜNÜN kapanışı henüz
    # oluşmamış oluyor → cari gün BOŞ dönüyor. 26 Ağu koşusu 23–26 aralığını
    # istedi ama DB'ye 25'e kadar yazıldı; panelde "26 Ağustos — çekim yok"
    # göründü ve kullanıcı haklı olarak sordu. Gün sonuna yakın ikinci koşu o günü
    # aynı gün içinde kapatır; 3 günlük pencere + upsert tekrarı zararsız kılar.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      bas:
        description: 'Başlangıç YYYY-MM-DD (boş: dün)'
        required: false
        default: ''
      bit:
        description: 'Bitiş YYYY-MM-DD (boş: bugün)'
        required: false
        default: ''

concurrency:
  group: a1b-anomali
  cancel-in-progress: false

jobs:
  a1b:
    runs-on: ubuntu-latest
    # ⚠️ 20 dk YETMEDİ: 19.08 koşusu Playwright chromium kurulumunda 20,4 dk'da
    # iptal oldu ve O GÜNÜN VERİSİ EKSİK KALDI (a1b_gun'da 18.08 yok). Kurulum
    # süresi runner yüküne göre değişiyor; 35 dk pay bırakılıyor.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Şema (idempotent)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # TELAFİ: elle tarih verilmediyse SON 3 GÜN çekilir (yalnız dün+bugün değil).
      # Bir gün koşu kaçarsa (19.08'de olduğu gibi) boşluk kalıcı olurdu; 3 günlük
      # pencere ertesi gün kendini onarır. Kayıtlar upsert, tekrar çekmek zararsız.
      # ⚠️ GÜVENLİK 2026-08-27: girdiler env üzerinden (bkz. fiyat-takip.yml notu).
      - name: A1b çek + anomali analizi
        run: |
          if [ -n "$BAS" ]; then
            npm run a1b -- $BAS $BIT
          else
            npm run a1b -- "$(date -u -d '3 days ago' +%F)" "$(date -u +%F)"
          fi
        env:
          BAS: ${{ github.event.inputs.bas }}
          BIT: ${{ github.event.inputs.bit }}
          POL_URL: ${{ secrets.POL_URL }}
          POL_KULLANICI: ${{ secrets.POL_KULLANICI }}
          POL_SIFRE: ${{ secrets.POL_SIFRE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
