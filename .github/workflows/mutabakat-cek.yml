name: Mutabakat Çekim (seviye + satış)

# Mutabakat formülünün A/C/D kalemlerini günlük biriktirir:
#   Fark = (A + B − C) − D
#     A = tank_seviye_gun.acilis_lt   ← seviyeCek (dünkü kapanış)
#     B = tank_dolum                  ← izleme job'u zaten çekiyor (artımlı)
#     C = satis_ozet                  ← satisCek
#     D = tank_seviye_gun.kapanis_lt  ← seviyeCek (bu geceki ölçüm)
#
# ⚠️ NEDEN AYRI WORKFLOW (izleme job'una eklenmedi):
# İzleme job'u 15 dakikada bir koşuyor ve ~2-3 dk sürüyor. Bu çekim günde 1 kez
# yeterli; izlemeye eklenirse aynı iş günde ~96 kez tekrarlanır (ASIS'e gereksiz
# yük, satış çekimi sayfa sayfa dönüyor) ve alarm turunu yavaşlatır.
#
# ⚠️⚠️ SEVİYE GEÇMİŞE DÖNÜK ALINAMAZ (2026-08-01 ölçümü, seviyeCek.ts başlığı):
# `GetTankLastLevel` ANLIK ölçüm verir, tarih parametresi YOKTUR. Bu workflow bir
# gün çalışmazsa o günün kapanış seviyesi KALICI OLARAK KAYBOLUR — sonradan
# `seviyeCek.ts 2026-08-01` çalıştırmak o günü DEĞİL, çalıştırıldığı anın ölçümünü
# eski güne yazar (sessiz veri yanlışlığı). Kaçan gün telafi EDİLMEZ, boş bırakılır.
# (Satış farklı: ASIS'te geçmiş duruyor, tarih vererek geriye çekilebilir.)

on:
  # 21:00 UTC = 00:00 TR → günün kapanış seviyesi. Satış varsayılanı "dün" olduğu
  # için bu saatte TR'de yeni gün başlamış olur ve tamamlanmış günü çeker.
  #
  # ⭐ DIŞ TETİKLEYİCİYE GEREK YOK (2026-08-04, ölçüldü — önceki değerlendirme yanlıştı).
  #
  # 15 dakikalık alarm job'unun gecikmesi (ortalama 95, en kötü 202 dk) bu GÜNLÜK
  # job'a atfedilmişti. Gerçek ölçüm çok daha iyi:
  #     cron '0 21' → gerçek koşu 21:56 UTC = TR 00:56  (yalnız 56 dk gecikme)
  #     ölçüm TR 03:30'a düştü → KAPANIS penceresi (22:00–06:00) İÇİNDE ✓
  #     3 Ağustos: 669 tankın 667'si pencere içinde
  # GH Actions sıklığı yüksek job'ları kısıyor; günde 1 koşan iş bu kısıtlamadan
  # neredeyse etkilenmiyor. Zamanlanmış koşu DÜZGÜN çalışıyor.
  #
  # 1 ve 4 Ağustos'un bozuk olmasının sebebi cron DEĞİL, ELLE TETİKLEMELERDİ
  # (TR 15:00 ve 12:00 ölçümü). Ona karşı seviyeCek.ts'e koruma eklendi.
  #
  # ⚠️ SAAT 21:00 UTC (TR 00:00) KALMALI — erkene ALINMAZ. Kısa süre 20:30'a
  # aldım, sonra geri döndüm: seviyeCek.ts hedef günü "TR bugün" olarak seçiyor.
  # TR 23:30'da koşarsa GÜN HENÜZ BİTMEMİŞTİR — akşam ölçümünü "gün kapanışı"
  # diye yazar ve satış "dün"ü çektiği için iki kalem farklı günlere bakar.
  # Gün sınırının HEMEN SONRASI doğru: 21:00 UTC = TR 00:00.
  #
  # Kalan risk: gecikme 3 saati aşarsa (ölçülen 56 dk, tipik değil) ölçüm TR
  # 03:00+ olur — hâlâ pencere içinde, sorun yok. 6 saati aşarsa pencere dışına
  # çıkar ve gün-ortası koruması o günü ATLAR (bozuk veri yazmaktansa eksik gün
  # bırakmak doğru). Telafi katmanı satışı zaten sonradan tamamlıyor.
  schedule:
    - cron: '0 21 * * *'
  # ⚠️⚠️ GÜN ORTASINDA ELLE TETİKLEMEK SEVİYE VERİSİNİ BOZAR (2026-08-04, yaşandı).
  # Snapshot ANLIK: kayda giren ölçüm saati = koşunun saati. Zamanlanmış koşu TR
  # 00:56'da doğru "gün kapanışı" yazmıştı; telafi adımını test etmek için TR
  # 08:48'de elle tetiklediğim iki koşu aynı günü EZDİ ve o satır sabah ölçümü
  # taşımaya başladı → mutabakat aralığının ucu gün ortasına kaydı, günlük satış
  # toplamı aralığa oturmadı, o gün kullanılamaz hale geldi.
  #   → seviyeCek.ts artık KENDİNİ KORUYOR: gün kapanışı sayılabilir bir kayıt
  #     (TR 22:00–06:00) varsa gün ortası çekimi ATLAR. Bilinçli tazeleme: ZORLA=1.
  #   → Yalnız satış çekmek istiyorsan tarih girerek tetikle; seviye adımı zaten
  #     kendi kendine atlayacak.
  workflow_dispatch:
    inputs:
      satis_bas:
        description: 'Satış başlangıç (YYYY-AA-GG) — boşsa dün'
        required: false
      satis_bit:
        description: 'Satış bitiş (YYYY-AA-GG) — boşsa başlangıçla aynı'
        required: false

concurrency:
  group: mutabakat-cek
  cancel-in-progress: false # yarıda kesmek eksik gün bırakır

jobs:
  cekim:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # satış sayfa sayfa dönüyor; ölçülen ~1-2 dk/gün, geniş pay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Şema (idempotent)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ÖNCE seviye: anlık ölçüm, gecikirse gün sınırını aşma riski var.
      # Satış geçmişe dönük çekilebildiği için sonraya bırakılır.
      - name: Tank seviye snapshot (A + D)
        run: npm run seviye
        env:
          ASIS_GATEWAY: ${{ secrets.ASIS_GATEWAY }}
          ASIS_GUID_KEY: ${{ secrets.ASIS_GUID_KEY }}
          ASIS_DAGITICI_KOD: ${{ secrets.ASIS_DAGITICI_KOD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Seviye başarısız olsa bile satış çekilsin (bağımsız kalemler).
      - name: Pompa satışı özet (C)
        if: always()
        run: npm run satis -- ${{ github.event.inputs.satis_bas }} ${{ github.event.inputs.satis_bit }}
        env:
          ASIS_GATEWAY: ${{ secrets.ASIS_GATEWAY }}
          ASIS_GUID_KEY: ${{ secrets.ASIS_GUID_KEY }}
          ASIS_DAGITICI_KOD: ${{ secrets.ASIS_DAGITICI_KOD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ⚠️ TELAFİ — cron kaçırdığı günü bir daha denemiyordu ve eksik gün KALICI
      # oluyordu. Mutabakatta bir günün eksikliği açılış zincirini koparıyor
      # (bkz. docs/bilgi/epdk-mutabakat.md). Bu adım son 7 günde eksik olan günleri
      # bulup dolduruyor → kaçan gün ertesi koşuda otomatik kapanır.
      # Elle tarih verilmişse ATLANIR (kullanıcı ne istediğini biliyor).
      - name: Satış telafi (son 7 günün eksikleri)
        if: github.event.inputs.satis_bas == ''
        run: npm run satis -- --telafi 7
        env:
          ASIS_GATEWAY: ${{ secrets.ASIS_GATEWAY }}
          ASIS_GUID_KEY: ${{ secrets.ASIS_GUID_KEY }}
          ASIS_DAGITICI_KOD: ${{ secrets.ASIS_DAGITICI_KOD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
