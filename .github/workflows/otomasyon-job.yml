name: Otomasyon İzleme Job

# Bu alt-proje KENDİ reposu olarak yayınlandı (yldrmabdullah/otomasyon-panel):
# package.json, core/, job/ repo KÖKÜNDE. Dolayısıyla working-directory ve
# cache-dependency-path'te `otomasyon-panel/` öneki OLMAZ.
#
# ⚠️ 2026-07-28/29: bu önek yüzünden job 15 dakikada bir fail ediyordu
# ("Some specified paths were not resolved, unable to cache dependencies")
# ve alarm bildirimleri hiç gitmiyordu. Yolları değiştirirken repo kökünün
# neresi olduğunu doğrula.

on:
  # ⚠️ GH Actions bu cron'u ÜCRETSİZ planda ciddi şekilde kısıyor: `*/15` yazsak da
  # ölçülen gerçek aralık ortalama 95 dk (61-202 dk arası, 2026-07-29).
  # Bu yüzden ASIL tetikleyici dışarıdan gelen workflow_dispatch çağrısı
  # (bkz docs/bilgi/baglanti-tank-izleme.md → "dışarıdan tetikleme").
  # Buradaki schedule yalnız YEDEK: dış tetikleyici düşerse sistem tamamen durmasın.
  schedule:
    - cron: '*/15 * * * *'
  # Elle VE dışarıdan (cron-job.org → GitHub API) tetikleme. Bu yol kısıtlanmıyor.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (1 = bildirim atmadan test)'
        required: false
        default: '0'

concurrency:
  group: otomasyon-job
  cancel-in-progress: false # üst üste binmesin ama çalışan iptal edilmesin

jobs:
  izleme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 GH Actions'ta deprecate edildi (runner zaten 24'e zorluyor).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      # ⚠️ ŞEMA HATASI ALARM TURUNU DÜŞÜRMESİN (2026-08-04, canlıda yaşandı).
      #
      # 09:15 koşusu "Connection terminated due to connection timeout" ile
      # patladı ve TÜM tur düştü — alarm hiç değerlendirilmedi. Oysa şema
      # idempotent ve zaten yerinde; geçici bir Supabase/ağ hıçkırığıydı
      # (40 koşuda 1, %2,5). İzleme turunu şema adımına bağlamak yanlış:
      # asıl iş alarm üretmek, şema yalnız güvenlik ağı.
      #
      # continue-on-error: adım patlasa da tur devam eder. Şema gerçekten
      # eksikse sonraki adım kendi hatasını verir (sessiz kalmaz).
      # 3 denemeli geri çekilme, geçici kopmayı kendi içinde yutar.
      - name: Şema (idempotent)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npm run db:migrate && exit 0
            echo "  şema denemesi $i başarısız, ${i}0 sn sonra tekrar..."
            sleep "${i}0"
          done
          echo "::warning::Şema uygulanamadı (3 deneme). Tur devam ediyor."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Job
        run: npm run job
        env:
          ASIS_GATEWAY: ${{ secrets.ASIS_GATEWAY }}
          ASIS_GUID_KEY: ${{ secrets.ASIS_GUID_KEY }}
          ASIS_DAGITICI_KOD: ${{ secrets.ASIS_DAGITICI_KOD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KOPUK_ESIK_SAAT: ${{ vars.KOPUK_ESIK_SAAT }}
          TANK_VERI_ESIK_DK: ${{ vars.TANK_VERI_ESIK_DK }}
          TEKRAR_BILDIRIM_SAAT: ${{ vars.TEKRAR_BILDIRIM_SAAT }}
          # KRİTİK: pasif filtre. Bu geçmezse aylardır kapalı ~90 istasyon her
          # turda alarm üretir ve bayiler boş yere rahatsız edilir.
          PASIF_ESIK_GUN: ${{ vars.PASIF_ESIK_GUN }}
          # ⭐ BİLDİRİM eşiği — ALARM eşiğinden AYRI (ölçüldü 2026-08-04).
          # Alarm 35 dk'da açılır ve panelde görünür; mail 3 saat bekler çünkü
          # alarmların %63'ü 30 dakikada kendiliğinden kapanıyor (flapping).
          # 7 günlük ölçüm: 35dk→1.915 mail · 2sa→192 · 3sa→49 (44 tekil tank).
          BILDIRIM_TANK_ESIK_SAAT: ${{ vars.BILDIRIM_TANK_ESIK_SAAT || '3' }}
          # ⚠️⚠️ BAYİLERE gönderim — VARSAYILAN KAPALI. Açmadan önce bildirim
          # hacmi canlıda izlenmeli: yanlış giden mesaj geri alınamaz ve bayi
          # güvenini yıkar. 178 bayi telefonu + 168 bayi maili DB'de HAZIR ama
          # kullanılmıyor. Açmak için repo variable BAYIYE_GONDER=1.
          BAYIYE_GONDER: ${{ vars.BAYIYE_GONDER || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EKIP_MAIL: ${{ secrets.EKIP_MAIL }}
          NETGSM_USERCODE: ${{ secrets.NETGSM_USERCODE }}
          NETGSM_PASSWORD: ${{ secrets.NETGSM_PASSWORD }}
          NETGSM_HEADER: ${{ secrets.NETGSM_HEADER }}
          EKIP_TELEFON: ${{ secrets.EKIP_TELEFON }}
          # workflow_dispatch'ten gelen dry_run; cron'da boş → '0'
          # ⭐ BİLDİRİM AÇMA/KAPAMA — repo variable ile, KOD DEĞİŞTİRMEDEN.
          #
          # Öncelik: (1) elle tetiklemede girilen dry_run, (2) repo variable
          # BILDIRIM_KAPALI, (3) varsayılan açık.
          #   BILDIRIM_KAPALI=1 → DRY_RUN=1 → job çalışır, alarm açar, panele
          #     yazar ama MAİL ATMAZ. İzleme kesintiye girmez, yalnız susar.
          #   Açmak için: Settings → Variables → BILDIRIM_KAPALI = 0
          #     (ya da `gh variable set BILDIRIM_KAPALI --body 0`)
          #
          # ⚠️ DRY_RUN'da "bildirildi" İŞARETLENMEZ (job/index.ts) — kapalı
          # dönemde biriken alarmlar açıldığında ilk maillerini alır.
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.BILDIRIM_KAPALI || '0' }}
